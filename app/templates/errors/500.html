{% extends 'base.html' %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-4 text-danger">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 5rem;"></i>
            </div>
            <h1 class="display-4 fw-bold text-white mb-3">500</h1>
            <h2 class="h3 fw-semibold text-secondary mb-4">Something went wrong.</h2>
            <p class="text-muted mb-5">
                Our servers encountered an unexpected error while processing your request. Please try again in a few moments.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-medium">
                    <i class="bi bi-arrow-clockwise me-2"></i>Try Again (Dashboard)
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
