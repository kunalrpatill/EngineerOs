<style>
    /* Premium Sidebar Overrides */
    .sidebar {
        background: #0f172a !important; /* Deep slate */
        border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
    }
    .sidebar-link {
        color: #94a3b8 !important;
        padding: 12px 20px !important;
        margin: 4px 12px !important;
        border-radius: 12px !important;
        display: flex;
        align-items: center;
        gap: 14px !important;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border-right: 3px solid transparent;
    }
    .sidebar-link:hover {
        background: rgba(255, 255, 255, 0.05) !important;
        color: #e2e8f0 !important;
    }
    .sidebar-link.active {
        background: linear-gradient(90deg, #1d4ed8 0%, rgba(37, 99, 235, 0.4) 100%) !important;
        color: #ffffff !important;
        border-right: 3px solid #00f0ff !important;
        border-top-right-radius: 4px !important;
        border-bottom-right-radius: 4px !important;
        box-shadow: inset -5px 0 15px rgba(0, 240, 255, 0.15) !important;
    }
    .sidebar-link i {
        font-size: 1.15rem;
    }
    .sidebar-link.active i {
        color: #ffffff !important;
    }
</style>
